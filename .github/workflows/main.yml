name: Deploy events to devex-server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency: events-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # La llave solo puede ejecutar /usr/local/sbin/deploy-events.sh en el servidor:
      # no se envía ningún comando porque el servidor ya fuerza ese.
      - name: Deploy on devex-server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST"
