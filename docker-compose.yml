version: '3.8'

services:
  websocket-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: websocket-filter-service
    container_name: websocket-service
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - EVENTS_SECRET=${EVENTS_SECRET:?Falta EVENTS_SECRET en .env}
      - ALLOWED_SERVICES=${ALLOWED_SERVICES:-devex}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://devex.pe}
      - MAX_CONNECTIONS_PER_IP=${MAX_CONNECTIONS_PER_IP:-50}
      - HANDSHAKES_PER_MINUTE_PER_IP=${HANDSHAKES_PER_MINUTE_PER_IP:-60}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - websocket-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  websocket-network:
    driver: bridge
